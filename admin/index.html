<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electoral College Game — Question bank</title>
<link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div class="wrap" id="app"><p>Loading…</p></div>
<script type="module">
import { $, h, fill, toast, notConfigured } from '../js/ui.js';
import { configured, signInGuest } from '../js/firebase.js';
import { loadQuestions, loadUsage, usageLabel } from '../js/questions.js';
import { autoScore } from '../js/scoring.js';

// Read-only browser for data/questions.json. Edits are made in the repo.
const app = $('#app');
let Q = {}, usage = {}, filter = { text: '', review: false, game: '', unused: false }, open = null;

if (!configured) notConfigured(app); else init();

async function init() {
  await signInGuest();
  Q = await loadQuestions();
  usage = await loadUsage(Q);
  render();
}

function render() {
  const all = Object.values(Q);
  const games = [...new Set(all.flatMap(q => q.games || []))].sort();
  const list = all.filter(q => (!filter.review || q.needsReview) && (!filter.game || (q.games || []).includes(filter.game)) &&
    (!filter.unused || !usage[q.id]?.length) &&
    (!filter.text || (q.text + ' ' + q.answer + ' ' + q.category).toLowerCase().includes(filter.text.toLowerCase())))
    .sort((a, b) => a.id.localeCompare(b.id));
  fill(app,
    h('div', { class: 'row' }, h('h1', { class: 'grow' }, 'Question bank'), h('a', { href: '../host/' }, '← Host')),
    h('p', { class: 'muted' }, 'Questions live in the repo (data/questions.json). Ask Claude to add or fix questions.'),
    h('div', { class: 'card' },
      h('div', { class: 'row' },
        h('input', { class: 'grow', placeholder: 'Search', value: filter.text, onchange: e => { filter.text = e.target.value; render(); } }),
        h('select', { onchange: e => { filter.game = e.target.value; render(); } }, h('option', { value: '' }, 'All games'), ...games.map(g => h('option', { selected: filter.game === g }, g))),
        h('label', { class: 'row', style: 'margin:0' }, h('input', { type: 'checkbox', style: 'width:auto', checked: filter.unused, onchange: e => { filter.unused = e.target.checked; render(); } }), 'Never used'),
        h('label', { class: 'row', style: 'margin:0' }, h('input', { type: 'checkbox', style: 'width:auto', checked: filter.review, onchange: e => { filter.review = e.target.checked; render(); } }), 'Needs review')),
      h('p', { class: 'muted' }, `${list.length} of ${all.length} questions · ${all.filter(q => q.needsReview).length} flagged for review`),
      h('table', {}, h('tr', {}, h('th', {}, 'Question'), h('th', {}, 'Answer'), h('th', {}, 'Type'), h('th', {}, 'Pts'), h('th', {}, 'Used in')),
        ...list.map(q => [
          h('tr', { style: 'cursor:pointer', onclick: () => { open = open === q.id ? null : q.id; render(); } },
            h('td', {}, q.text, q.needsReview ? h('div', { class: 'muted' }, '⚠ ', (q.reviewNotes || []).join(' · ')) : null),
            h('td', {}, q.answer), h('td', {}, q.type, q.judge === 'host' ? ' (host)' : ''), h('td', {}, q.value),
            h('td', { class: 'muted' }, usageLabel(usage[q.id]))),
          open === q.id ? h('tr', {}, h('td', { colspan: 5 }, tester(q))) : null,
        ]).flat())));
}

function tester(q) {
  const out = h('span', { class: 'pill' }, '');
  const inp = h('input', { placeholder: 'Try an answer to see how it scores', oninput: () => { const r = autoScore(q, inp.value); out.textContent = `${r.points} pts ${r.note || ''}`; } });
  return h('div', {},
    q.type === 'range' && q.bands ? h('p', { class: 'muted' }, 'Steps: ', q.bands.map(b => `${b.points}: ${b.ranges.map(([a, z]) => a === z ? a : `${a}–${z ?? '+'}`).join(', ')}`).join(' | ')) : null,
    q.type === 'range' && !q.bands && q.step ? h('p', { class: 'muted' }, `Exact ${q.answerLo}${q.answerHi !== q.answerLo ? '–' + q.answerHi : ''}, step width ${q.step}`) : null,
    q.type === 'list' ? h('p', { class: 'muted' }, `${q.perItem} pts each: ${(q.items || []).join(', ')}`) : null,
    h('div', { class: 'row' }, inp, out));
}
</script>
</body>
</html>
