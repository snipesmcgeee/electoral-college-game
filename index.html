<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electoral College Game</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="phone">
<div class="wrap">
  <h1 style="margin-top:2rem">Electoral College Game</h1>
  <p class="muted">Answer trivia, earn points, spend them on states. Most electoral votes wins.</p>
  <form onsubmit="event.preventDefault(); location.href='play/?code=' + this.c.value.trim().toUpperCase();">
    <label>Room code</label>
    <input name="c" autocapitalize="characters" maxlength="6" autofocus>
    <button class="bigbtn">Play</button>
  </form>
  <p style="margin-top:1.5rem" class="muted">Running the game?</p>
  <a href="host/"><button class="bigbtn secondary">Host a game</button></a>
  <a href="board/"><button class="bigbtn secondary">Show the board (TV)</button></a>
  <p style="margin-top:1rem"><a href="admin/">Question bank</a></p>
</div>
</body>
</html>
