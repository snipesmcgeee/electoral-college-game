<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electoral College Game — Play</title>
<link rel="stylesheet" href="../css/app.css">
</head>
<body class="phone">
<div class="wrap" id="app"><p>Loading…</p></div>
<script type="module">
import { $, h, fill, qs, fmt, pct, toast, notConfigured, showError } from '../js/ui.js';
import { configured, signInGuest, gameRef, sub, subCol, fs } from '../js/firebase.js';
import { loadStates, view, teamName } from '../js/game.js';
import { margin, leader, validateDraft, playerBalance } from '../js/engine.js';
import { applyTeamColors } from '../js/map.js';

const app = $('#app');
let user, code, game, me, allStates, draft = {}, teamDrafts = {}, myAnswer = null, unsubs = [], roster = [];
let step = (() => { try { return Math.max(1, Number(localStorage.getItem('ecg.step')) || 1); } catch { return 1; } })();
let sortBy = (() => { try { return localStorage.getItem('ecg.sort') || 'ev'; } catch { return 'ev'; } })();

if (!configured) notConfigured(app); else init();

async function init() {
  user = await signInGuest();
  allStates = await loadStates();
  code = (qs.get('code') || localStorage.getItem('ecg.code') || '').toUpperCase();
  if (!code) return askCode();
  join();
}

function askCode() {
  fill(app, h('h1', {}, 'Join a game'),
    h('form', { onsubmit: e => { e.preventDefault(); code = e.target.c.value.trim().toUpperCase(); join(); } },
      h('label', {}, 'Room code'), h('input', { name: 'c', autocapitalize: 'characters', maxlength: 6, autofocus: true }),
      h('button', { class: 'bigbtn' }, 'Join')));
}

async function join() {
  const g = await fs.getDoc(gameRef(code));
  if (!g.exists()) { toast(`No game with code ${code}`, 'err'); localStorage.removeItem('ecg.code'); return askCode(); }
  localStorage.setItem('ecg.code', code);
  const p = await fs.getDoc(sub(code, 'players', user.uid));
  if (p.exists()) return listen();
  pickTeam(g.data());
}

function pickTeam(g) {
  const saved = localStorage.getItem('ecg.nick') || '';
  const nick = h('input', { maxlength: 20, autocomplete: 'off', value: saved.toUpperCase() === code ? '' : saved });
  fill(app, h('h1', {}, 'Join the game'),
    h('p', {}, h('span', { class: 'pill ok' }, `Room ${code} ✓`), ' ',
      h('a', { href: '#', onclick: e => { e.preventDefault(); localStorage.removeItem('ecg.code'); askCode(); } }, 'wrong room?')),
    h('label', { style: 'font-size:1.2rem;font-weight:700' }, 'Your name'), nick,
    h('p', { class: 'muted', style: 'margin-top:.2rem' }, 'This is the name the host and other players see.'),
    h('label', {}, 'Pick your party'),
    ...g.settings.teams.map(t => h('button', { class: `bigbtn ${t.id}`, onclick: async () => {
      const name = nick.value.trim();
      if (!name) { nick.focus(); return toast('Enter your name first', 'err'); }
      if (name.toUpperCase() === code) { nick.value = ''; nick.focus(); return toast('That’s the room code. Enter your own name.', 'err'); }
      try { localStorage.setItem('ecg.nick', name); } catch {}
      await fs.setDoc(sub(code, 'players', user.uid), { uid: user.uid, name, team: t.id, joinedAt: Date.now() });
      listen();
    } }, t.name)));
}

function listen() {
  unsubs.forEach(u => u()); unsubs = [];
  unsubs.push(fs.onSnapshot(sub(code, 'players', user.uid), s => { me = s.data(); render(); }, showError));
  unsubs.push(fs.onSnapshot(subCol(code, 'players'), s => { roster = s.docs.map(d => d.data()); if (game?.status === 'lobby') render(); }, showError));
  unsubs.push(fs.onSnapshot(gameRef(code), s => {
    const prevQ = game?.current?.id;
    game = s.data();
    if (game?.current?.id !== prevQ) { myAnswer = null; watchAnswer(); }
    render();
  }, showError));
}

let draftUnsub = null, answerUnsub = null;
const candidate = () => game.settings.mode === 'candidate';
const draftId = () => candidate() ? user.uid : me.team;
function watchDraft() {
  if (draftUnsub || !me) return;
  draftUnsub = () => {}; // placeholder: the first snapshot can arrive before onSnapshot returns
  if (candidate() && game.settings.seeTeam !== false) {
    // teammates' plans are visible live: watch the whole party's drafts
    draftUnsub = fs.onSnapshot(fs.query(subCol(code, 'drafts'), fs.where('team', '==', me.team)), s => {
      teamDrafts = Object.fromEntries(s.docs.map(d => [d.id, d.data()?.alloc || {}]));
      draft = teamDrafts[user.uid] || {}; render();
    }, () => { draftUnsub = null; });
  } else {
    draftUnsub = fs.onSnapshot(sub(code, 'drafts', draftId()), s => { draft = s.data()?.alloc || {}; teamDrafts = {}; render(); },
      () => { draftUnsub = null; });
  }
}
function answerId() { return game.settings.mode === 'party' ? `${game.current.id}__${me.team}` : `${game.current.id}__${user.uid}`; }
function watchAnswer() {
  answerUnsub?.(); answerUnsub = null;
  if (!game?.current || !me) return;
  answerUnsub = () => {};
  answerUnsub = fs.onSnapshot(sub(code, 'answers', answerId()), s => { myAnswer = s.data() || null; render(); }, () => {});
}

function render() {
  if (!game || !me) return;
  if (!answerUnsub && game.current) watchAnswer();
  const v = view(game, allStates);
  const t = me.team;
  applyTeamColors(game);
  const bal = candidate() ? playerBalance(game, user.uid) : v.balance[t];
  const planned = game.status === 'spending' ? validateDraft(draft, bal, v.closed).total : 0;
  const header = h('div', { class: 'row sticky' },
    h('span', { class: `pill ${t}` }, teamName(game, t)),
    h('span', { class: 'muted grow' }, me.name),
    game.status === 'spending'
      ? h('span', {}, 'Balance ', h('b', {}, fmt(bal)), ' · Spent ', h('b', {}, fmt(planned)), ' · Left ',
          h('b', { style: bal - planned ? '' : 'color:var(--ok)' }, fmt(bal - planned)))
      : h('span', {}, 'Balance ', h('b', {}, fmt(bal))));
  let body;
  switch (game.status) {
    case 'lobby': body = h('div', { class: 'card' }, h('h2', {}, 'You’re in'), h('p', {}, 'Waiting for the host to start.'),
      game.leaders?.[t] === user.uid ? h('p', { class: 'pill' }, 'You are your party’s leader') : null,
      h('h3', { style: 'margin-top:1rem' }, `In the room (${roster.length})`),
      ...game.settings.teams.map(tm => h('p', {}, h('span', { class: `pill ${tm.id}` }, tm.name), ' ',
        roster.filter(p => p.team === tm.id).map(p => p.name).sort().join(', ') || '—'))); break;
    case 'question': case 'scoring': body = questionView(v); break;
    case 'spending': watchDraft(); body = spendingView(v); break;
    case 'over': body = resultView(v); break;
    default: body = h('p', {}, '…');
  }
  fill(app, header, body,
    h('p', { class: 'muted', style: 'margin-top:2rem;font-size:.8rem' }, `Room ${code} · `,
      h('a', { href: '#', onclick: e => { e.preventDefault(); localStorage.removeItem('ecg.code'); location.href = location.pathname; } }, 'leave')));
}

function questionView(v) {
  const c = game.current;
  if (!c) return h('div', { class: 'card' }, h('p', {}, 'Get ready for the next question…'));
  const open = game.answersOpen && game.status === 'question';
  const party = game.settings.mode === 'party';
  const numeric = ['number', 'range', 'closer'].includes(c.type);
  const input = c.type === 'list'
    ? h('textarea', { name: 'a', rows: 5, placeholder: 'One per line or separated by commas' })
    : c.type === 'tf'
      ? h('select', { name: 'a' }, h('option', { value: '' }, 'Pick one'), h('option', { value: 'True' }, 'True'), h('option', { value: 'False' }, 'False'))
      : h('input', { name: 'a', inputmode: numeric ? 'decimal' : 'text', autocomplete: 'off' });
  if (myAnswer) input.value = myAnswer.text;
  const revealed = game.reveal?.qid === c.id;
  return h('div', { class: 'card' },
    h('div', { class: 'muted' }, `${c.category || ''} · up to ${c.value} pts${c.items ? ` · ${c.items} answers` : ''}`),
    h('h2', {}, c.text),
    open ? h('form', { onsubmit: async e => {
      e.preventDefault();
      const text = e.target.a.value.trim(); if (!text) return;
      await fs.setDoc(sub(code, 'answers', answerId()), {
        qid: c.id, team: me.team, uid: user.uid, name: me.name, text, at: Date.now() });
      toast('Answer sent');
    } }, input, h('button', { class: 'bigbtn' }, myAnswer ? 'Update answer' : 'Submit'))
      : h('p', { class: 'muted' }, 'Answers are closed.'),
    myAnswer ? h('p', { class: 'muted' }, party ? `Your party’s answer (from ${myAnswer.name}): ` : 'Your answer: ', h('b', {}, myAnswer.text)) : null,
    revealed ? h('p', {}, 'Answer: ', h('b', {}, game.reveal.answer), ` · your party +${game.reveal.points[me.team] ?? 0}`) : null);
}

function spendingView(v) {
  const t = me.team;
  const cand = candidate();
  const bal = cand ? playerBalance(game, user.uid) : v.balance[t];
  const locked = cand ? !!(game.plocked?.[user.uid] || game.locked?.[t]) : !!game.locked?.[t];
  const canLock = cand || game.settings.lockBy === 'anyone' || game.leaders?.[t] === user.uid;
  const check = validateDraft(draft, bal, v.closed);
  const left = bal - check.total;
  // Never let a typed or tapped amount go past what's left.
  const set = async (codeSt, n) => {
    const mine = Number(draft[codeSt] || 0);
    const max = mine + Math.max(0, left);
    n = Math.min(max, Math.max(0, Math.floor(Number(n) || 0)));
    if (n === mine) { render(); return; }
    draft = { ...draft, [codeSt]: n }; render(); // show it right away
    const data = { alloc: { [codeSt]: n } };
    if (cand) data.team = t;
    try { await fs.setDoc(sub(code, 'drafts', draftId()), data, { merge: true }); }
    catch (e) { toast('Could not save — is spending open?', 'err'); }
  };
  const m = s => margin(v.spend[s.code], v.teams);
  const sorters = {
    ev: (a, b) => b.ev - a.ev || a.name.localeCompare(b.name),
    lead: (a, b) => {
      const g = s => { const l = leader(v.spend[s.code], v.teams); return l === t ? 0 : l ? 2 : 1; };
      return g(a) - g(b) || (g(a) === 0 ? m(b) - m(a) : g(a) === 2 ? m(a) - m(b) : 0) || b.ev - a.ev;
    },
    lock: (a, b) => m(b) - m(a) || b.ev - a.ev,
    abc: (a, b) => a.name.localeCompare(b.name),
  };
  const open = v.states.filter(s => !v.closed[s.code]).sort(sorters[sortBy] || sorters.ev);
  const sortBtns = h('div', { class: 'row', style: 'gap:.3rem' }, ...[['ev', 'Electoral votes'], ['lead', 'Biggest lead'], ['lock', 'Closest to being called'], ['abc', 'A–Z']]
    .map(([k, label]) => h('button', { class: `small ${sortBy === k ? '' : 'secondary'}`, onclick: () => { sortBy = k; try { localStorage.setItem('ecg.sort', k); } catch {} render(); } }, label)));
  const need = x => Math.max(0, 270 - v.ec.final[x]);
  const toWin = h('div', { class: 'muted', style: 'font-size:.9rem' }, 'To win (270): ',
    ...v.teams.map((x, i) => h('span', {}, i ? ' · ' : '', h('b', { style: `color:var(--${x})` }, teamName(game, x)),
      ` ${v.ec.final[x]} called +${v.ec.lean[x]} leaning, needs ${need(x)}`)));
  const stepBox = h('div', { class: 'row', style: 'align-items:center;gap:.5rem' },
    h('label', { style: 'margin:0;font-weight:700' }, 'Amount per +/- Click'),
    h('input', { type: 'number', min: 1, inputmode: 'numeric', style: 'width:5rem', value: step, 'data-keep': 'step',
      onchange: e => { step = Math.max(1, Math.floor(Number(e.target.value) || 1)); try { localStorage.setItem('ecg.step', step); } catch {} render(); } }));
  // teammates' plans (candidate mode, when the host allows it)
  const mates = cand && game.settings.seeTeam !== false
    ? Object.entries(teamDrafts).filter(([uid]) => uid !== user.uid) : [];
  const matesIn = code => mates.reduce((a, [, al]) => a + (Number(al[code]) || 0), 0);
  const rows = open.map(s => {
    const sp = v.spend[s.code] || {};
    const lead = leader(sp, v.teams);
    const mine = Number(draft[s.code] || 0);
    const inp = h('input', { type: 'number', min: 0, max: mine + Math.max(0, left), value: mine || '', disabled: locked, onchange: e => set(s.code, e.target.value) });
    const mateAmt = mates.length ? matesIn(s.code) : 0;
    return h('div', { class: 'state-row' },
      h('div', { class: 'code', style: `color:${lead ? `var(--${lead})` : 'inherit'}` }, s.code),
      h('div', {}, h('div', {}, `${s.name} · ${s.ev} EV`),
        h('div', { class: 'info' }, v.teams.map(x => `${teamName(game, x)} ${sp[x] || 0}`).join(' · '), ` · ${pct(margin(sp, v.teams))}`,
          mateAmt ? h('b', {}, ` · teammates +${mateAmt}`) : null)),
      h('div', { class: 'stepper' },
        h('button', { class: 'secondary', disabled: locked || !mine, onclick: () => set(s.code, mine - step) }, '−'),
        inp,
        h('button', { class: 'secondary', disabled: locked || left <= 0, onclick: () => set(s.code, mine + step) }, '+')));
  });
  const who = cand ? 'your own points' : `${teamName(game, t)}’s points`;
  const note = cand
    ? (game.settings.seeTeam !== false ? 'You spend only what you earned. Your party sees your plan live; the other party sees nothing until everyone locks.'
        : 'You spend only what you earned. Nobody sees your plan until the reveal.')
    : 'Your party sees this draft live. The other party sees nothing until both lock.';
  return h('div', {},
    h('div', { class: 'card' },
      h('h2', {}, `Spending round ${game.round || ''}`),
      toWin,
      check.ok ? null : h('p', {}, h('span', { class: 'pill warn' }, check.errors[0])),
      h('p', { class: 'muted' }, note),
      locked ? h('p', { class: 'pill ok' }, cand ? 'Locked — waiting for everyone else' : 'Locked — waiting for reveal')
        : h('button', { class: 'bigbtn', disabled: !check.ok || !canLock || check.total !== bal, onclick: async () => {
            if (!confirm(`Lock ${check.total} of ${who}?`)) return;
            try { await fs.updateDoc(gameRef(code), cand ? { [`plocked.${user.uid}`]: true } : { [`locked.${t}`]: true }); }
            catch (e) { toast('Could not lock', 'err'); }
          } }, !canLock ? 'Only your leader can lock' : check.total !== bal ? `Spend all points to lock (${fmt(left)} left)` : 'Lock spending')),
    h('div', { class: 'card' }, h('h3', {}, `${open.length} states not yet called`), stepBox, sortBtns, ...rows));
}

function resultView(v) {
  const r = game.result; if (!r) return h('p', {}, 'Tallying…');
  const [L, R] = v.teams;
  return h('div', { class: 'card' }, h('h2', {}, r.ecWinner ? `${teamName(game, r.ecWinner)} wins!` : 'Tie — bonus question'),
    h('p', {}, `Electoral College ${r.ec[L]}–${r.ec[R]} · Popular vote ${fmt(r.popular[L])}–${fmt(r.popular[R])}`),
    game.playerTotals?.[user.uid] !== undefined ? h('p', {}, `Your points: ${fmt(game.playerTotals[user.uid])}`) : null);
}
</script>
</body>
</html>
